<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="menu">
        <button id="createGridBtn">Create grid</button>
        <button id="clearBtn">Clear</button>
        <button id="downloadBtn">Download</button>
        |
        <label for="colorPicker">Select a color:</label>
        <input type="color" id="colorPicker" name="colorPicker" value="#ff0000">
        |
        <input type="checkbox" id="rainbow" name="rainbow">
        <label for="rainbow">Rainbow 🌈</label><br>
        |
        <input type="checkbox" id="eraser" name="eraser">
        <label for="eraser">Eraser Mode</label><br>
    </div>
    <div id="container"></div>
    <script src="index.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>

</html>
